<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>물 분자 ↔ 눈 결정 결정화 상변화 시뮬레이션</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050b14; font-family: sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; }
        #ui-panel {
            position: absolute; top: 20px; right: 20px;
            background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 20px; border-radius: 12px; color: white; width: 300px; backdrop-filter: blur(8px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .control-group { margin-bottom: 12px; }
        label { display: block; font-size: 13px; margin-bottom: 5px; color: #cbd5e1; }
        input[type=range], input[type=number] {
            width: 100%; box-sizing: border-box; background: #1e293b; border: 1px solid #475569;
            color: white; padding: 6px; border-radius: 6px; outline: none;
        }
        input[type=range] { cursor: pointer; }
        .btn-group { display: flex; gap: 8px; margin-top: 10px; }
        button {
            flex: 1; padding: 8px; border: none; border-radius: 6px;
            background: #2563eb; color: white; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        button:hover { background: #3b82f6; }
        .reset-btn { background: #ef4444; }
        .reset-btn:hover { background: #f87171; }
        #info-text { font-size: 11px; color: #94a3b8; line-height: 1.4; margin-top: 12px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 8px; }
    </style>
    <!-- Three.js 및 OrbitControls 로드 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="ui-panel">
        <h3 style="margin-top:0; color:#38bdf8;">상변화 시뮬레이션</h3>
        
        <!-- 1. 온도 조절 -->
        <div class="control-group">
            <label>온도 조절: <span id="temp-val" style="color:#38bdf8; font-weight:bold;">4°C</span></label>
            <input type="range" id="temp-slider" min="-20" max="40" value="4" step="1">
        </div>

        <!-- 2. 분자 수 조절 -->
        <div class="control-group">
            <label>물 분자 수:</label>
            <input type="number" id="molecule-count" min="6" max="150" value="6" step="6">
        </div>

        <!-- 3. 확대/축소 바 (줌) -->
        <div class="control-group">
            <label>확대/축소 (시점):</label>
            <input type="range" id="zoom-slider" min="5" max="80" value="15" step="0.5">
        </div>

        <!-- 컨트롤 버튼 -->
        <div class="control-group btn-group">
            <button id="btn-play">▶ 재생 (냉각 시뮬레이션)</button>
            <button id="btn-pause">⏸ 멈춤</button>
        </div>
        <button id="btn-reset" class="reset-btn" style="width:100%;">🔄 초기화</button>

        <div id="info-text">
            * <b>▶ 재생:</b> 4°C에서 온도가 내려가며 눈 결정 성장<br>
            * <b>0°C 초과:</b> 눈 결정 생성 불가 (액체상태)<br>
            * <b>0°C 이하 + 줌아웃:</b> 서서히 형성된 눈 결정 관찰
        </div>
    </div>

    <script>
        // 1. Scene / Camera / Renderer 설정
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050b14, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 15);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.minDistance = 5;
        controls.maxDistance = 80;

        // 조명 설정
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        const pointLight = new THREE.PointLight(0x38bdf8, 2, 80);
        pointLight.position.set(10, 10, 10);
        scene.add(pointLight);

        // 2. 변수 정의
        let isPlaying = false;
        let isCooling = false; // 재생 시 자동 냉각 진행 여부
        let currentTemp = 4;
        let molecules = [];
        let crystalBranches = []; // 성장 효과를 위한 가지 요소 배열
        
        const moleculeGroup = new THREE.Group();
        const crystalGroup = new THREE.Group();
        scene.add(moleculeGroup);
        scene.add(crystalGroup);

        // 3. 물 분자(H2O) 생성
        function createWaterMolecule() {
            const group = new THREE.Group();

            const oGeo = new THREE.SphereGeometry(0.3, 16, 16);
            const oMat = new THREE.MeshPhongMaterial({ color: 0xef4444, transparent: true, opacity: 1 });
            const oMesh = new THREE.Mesh(oGeo, oMat);
            group.add(oMesh);

            const hGeo = new THREE.SphereGeometry(0.15, 16, 16);
            const hMat = new THREE.MeshPhongMaterial({ color: 0xf8fafc, transparent: true, opacity: 1 });
            
            const h1 = new THREE.Mesh(hGeo, hMat);
            h1.position.set(0.35, 0.25, 0);
            const h2 = new THREE.Mesh(hGeo, hMat);
            h2.position.set(-0.35, 0.25, 0);
            
            group.add(h1);
            group.add(h2);

            return group;
        }

        // 4. 눈 결정(Snowflake) 구조 생성 (동적 성장 지원)
        function createSnowflakeMesh() {
            crystalGroup.clear();
            crystalBranches = [];

            const material = new THREE.MeshPhongMaterial({ 
                color: 0x38bdf8, 
                side: THREE.DoubleSide, 
                transparent: true, 
                opacity: 0,
                shininess: 90 
            });

            const snowflake = new THREE.Group();
            
            for (let i = 0; i < 6; i++) {
                const branch = new THREE.Group();
                const angle = (i / 6) * Math.PI * 2;

                const stemGeo = new THREE.BoxGeometry(0.2, 8, 0.1);
                // 성장 애니메이션용 변환 기준 축 조정
                stemGeo.translate(0, 4, 0);
                const stem = new THREE.Mesh(stemGeo, material.clone());
                branch.add(stem);
                crystalBranches.push({ mesh: stem, type: 'stem' });

                for (let j = 1; j <= 3; j++) {
                    const subGeo = new THREE.BoxGeometry(0.15, 2.5, 0.1);
                    subGeo.translate(0, 1.25, 0);

                    const sub1 = new THREE.Mesh(subGeo, material.clone());
                    sub1.position.set(0.2, j * 1.8, 0);
                    sub1.rotation.z = -Math.PI / 4;

                    const sub2 = new THREE.Mesh(subGeo, material.clone());
                    sub2.position.set(-0.2, j * 1.8, 0);
                    sub2.rotation.z = Math.PI / 4;

                    branch.add(sub1);
                    branch.add(sub2);
                    crystalBranches.push({ mesh: sub1, type: 'sub', delay: j * 0.2 });
                    crystalBranches.push({ mesh: sub2, type: 'sub', delay: j * 0.2 });
                }

                branch.rotation.z = angle;
                snowflake.add(branch);
            }
            crystalGroup.add(snowflake);
        }
        createSnowflakeMesh();

        // 5. 물 분자 초기화
        function initMolecules(count) {
            molecules.forEach(m => moleculeGroup.remove(m));
            molecules = [];

            for (let i = 0; i < count; i++) {
                const layer = Math.floor(i / 6);
                const indexInLayer = i % 6;
                const angle = (indexInLayer / 6) * Math.PI * 2;
                const radiusOffset = layer * 1.2;

                const mol = createWaterMolecule();
                mol.userData = { 
                    baseAngle: angle,
                    radiusOffset: radiusOffset
                };
                moleculeGroup.add(mol);
                molecules.push(mol);
            }
        }
        initMolecules(6);

        // 6. 물리 연산 및 온도/성장 업데이트
        function updatePhysics() {
            // 재생 중이면서 자동 냉각인 경우 온도 차츰 감소
            if (isPlaying && isCooling) {
                if (currentTemp > -15) {
                    currentTemp -= 0.05;
                    document.getElementById('temp-slider').value = currentTemp;
                    document.getElementById('temp-val').innerText = `${Math.round(currentTemp)}°C`;
                }
            }

            // 분자 개별 운동 업데이트
            molecules.forEach((mol) => {
                const layerRad = 1.5 + mol.userData.radiusOffset;

                if (currentTemp > 4) {
                    const speed = (currentTemp - 4) * 0.003;
                    mol.position.x += (Math.random() - 0.5) * speed;
                    mol.position.y += (Math.random() - 0.5) * speed;
                    mol.position.z += (Math.random() - 0.5) * speed;
                } else if (currentTemp === 4) {
                    const targetX = Math.cos(mol.userData.baseAngle) * layerRad;
                    const targetY = Math.sin(mol.userData.baseAngle) * layerRad;
                    mol.position.x += (targetX - mol.position.x) * 0.1;
                    mol.position.y += (targetY - mol.position.y) * 0.1;
                    mol.position.z *= 0.9;
                } else {
                    const targetX = Math.cos(mol.userData.baseAngle) * (layerRad * 1.8);
                    const targetY = Math.sin(mol.userData.baseAngle) * (layerRad * 1.8);
                    mol.position.x += (targetX - mol.position.x) * 0.1;
                    mol.position.y += (targetY - mol.position.y) * 0.1;
                    mol.position.z *= 0.9;
                }
            });

            // 눈 결정 스케일 및 성장률 계산 (0°C 이하일 때만 진행)
            let growthFactor = 0;
            if (currentTemp <= 0) {
                growthFactor = Math.min(1, Math.max(0, (0 - currentTemp) / 15)); // 0°C -> -15°C 로 가면서 완성
            }

            crystalBranches.forEach((b) => {
                if (b.type === 'stem') {
                    b.mesh.scale.set(1, growthFactor, 1);
                } else if (b.type === 'sub') {
                    let subGrowth = Math.max(0, (growthFactor - b.delay) / (1 - b.delay));
                    b.mesh.scale.set(1, Math.min(1, subGrowth), 1);
                }
            });

            crystalGroup.rotation.z += 0.002;
        }

        // 7. 시점 및 온도별 눈 결정 노출 여부 조절
        function updateVisibility() {
            const dist = camera.position.distanceTo(scene.position);
            document.getElementById('zoom-slider').value = dist;

            // 시점에 따른 페이드 비율 (거리 15~40 구간)
            let zoomFade = Math.max(0, Math.min(1, (dist - 15) / 25));

            // 온도가 0도 이하일 때만 결정체 형성
            let tempFactor = currentTemp <= 0 ? Math.min(1, Math.abs(currentTemp) / 5) : 0;
            let crystalOpacity = zoomFade * tempFactor;

            // 미시 분자 투명도
            molecules.forEach(mol => {
                mol.children.forEach(atom => {
                    atom.material.opacity = 1 - zoomFade;
                });
            });

            // 거시 눈 결정 투명도 (0도 초과 시 아예 사라짐)
            crystalGroup.traverse(child => {
                if (child.isMesh) {
                    child.material.opacity = crystalOpacity;
                }
            });
        }

        // 8. UI 이벤트 핸들러
        const tempSlider = document.getElementById('temp-slider');
        const tempValText = document.getElementById('temp-val');
        const countInput = document.getElementById('molecule-count');
        const zoomSlider = document.getElementById('zoom-slider');

        tempSlider.addEventListener('input', (e) => {
            currentTemp = parseFloat(e.target.value);
            tempValText.innerText = `${Math.round(currentTemp)}°C`;
            isCooling = false;
        });

        countInput.addEventListener('change', (e) => {
            let val = parseInt(e.target.value);
            if (isNaN(val) || val < 1) val = 6;
            initMolecules(val);
        });

        zoomSlider.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            camera.position.setLength(val);
        });

        // ▶ 재생 버튼: 4°C에서 온도가 점점 하강하며 결정이 결정화(성장)되는 모드 시작
        document.getElementById('btn-play').addEventListener('click', () => {
            isPlaying = true;
            isCooling = true;
            if (currentTemp > 4) currentTemp = 4;
        });

        document.getElementById('btn-pause').addEventListener('click', () => {
            isPlaying = false;
            isCooling = false;
        });

        document.getElementById('btn-reset').addEventListener('click', () => {
            isPlaying = false;
            isCooling = false;
            currentTemp = 4;
            tempSlider.value = 4;
            tempValText.innerText = '4°C';

            countInput.value = 6;
            initMolecules(6);

            camera.position.set(0, 0, 15);
            controls.target.set(0, 0, 0);
            controls.update();
        });

        controls.addEventListener('change', updateVisibility);

        // 9. 루프 실행
        function animate() {
            requestAnimationFrame(animate);
            updatePhysics();
            controls.update();
            updateVisibility();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
