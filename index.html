<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>물 분자 ↔ 눈 결정 상변화 시뮬레이션</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050b14; font-family: sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; }
        #ui-panel {
            position: absolute; top: 20px; right: 20px;
            background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 20px; border-radius: 12px; color: white; width: 280px; backdrop-filter: blur(8px);
        }
        .control-group { margin-bottom: 15px; }
        label { display: block; font-size: 14px; margin-bottom: 5px; color: #cbd5e1; }
        input[type=range] { width: 100%; cursor: pointer; }
        .btn-group { display: flex; gap: 10px; }
        button {
            flex: 1; padding: 8px; border: none; border-radius: 6px;
            background: #2563eb; color: white; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        button:hover { background: #3b82f6; }
        #info-text { font-size: 12px; color: #94a3b8; line-height: 1.4; margin-top: 10px; }
    </style>
    <!-- Three.js 3D 라이브러리 로드 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="ui-panel">
        <h3>상변화 시뮬레이션</h3>
        <div class="control-group">
            <label>온도 조절: <span id="temp-val" style="color:#38bdf8; font-weight:bold;">4°C</span></label>
            <input type="range" id="temp-slider" min="-20" max="40" value="4" step="1">
        </div>
        <div class="control-group btn-group">
            <button id="btn-play">▶ 재생</button>
            <button id="btn-pause">⏸ 멈춤</button>
        </div>
        <div id="info-text">
            * <b>마우스 휠:</b> 줌인(미시 분자) ↔ 줌아웃(거시 눈 결정)<br>
            * <b>4°C:</b> 분자 간 조밀도 최대 (밀도 최대)<br>
            * <b>0°C 이하:</b> 3차원 정육각형 격자 고정
        </div>
    </div>

    <script>
        // 1. Scene / Camera / Renderer 설정
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050b14, 0.02);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 15);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // 조명 설정
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const pointLight = new THREE.PointLight(0x38bdf8, 2, 50);
        pointLight.position.set(10, 10, 10);
        scene.add(pointLight);

        // 2. 분자 및 결정 상태 변수
        let isPlaying = true;
        let currentTemp = 4;
        const molecules = [];
        const moleculeGroup = new THREE.Group();
        scene.add(moleculeGroup);

        // 물분자(H2O) 오브젝트 생성 함수
        function createWaterMolecule() {
            const group = new THREE.Group();
            // 산소 원자 (레드/블루 계열)
            const oGeo = new THREE.SphereGeometry(0.3, 16, 16);
            const oMat = new THREE.MeshPhongMaterial({ color: 0xef4444 });
            const oMesh = new THREE.Mesh(oGeo, oMat);
            group.add(oMesh);

            // 수소 원자 2개 (104.5도 각도 배치)
            const hGeo = new THREE.SphereGeometry(0.15, 16, 16);
            const hMat = new THREE.MeshPhongMaterial({ color: 0xf8fafc });
            
            const h1 = new THREE.Mesh(hGeo, hMat);
            h1.position.set(0.35, 0.25, 0);
            const h2 = new THREE.Mesh(hGeo, hMat);
            h2.position.set(-0.35, 0.25, 0);
            
            group.add(h1);
            group.add(h2);

            return group;
        }

        // 육각형 배치 뼈대 생성 (미시 분자 그룹)
        const numRings = 6;
        for (let i = 0; i < numRings; i++) {
            const angle = (i / numRings) * Math.PI * 2;
            const mol = createWaterMolecule();
            mol.userData = { 
                baseAngle: angle,
                baseRadius: 2.5,
                velocity: new THREE.Vector3((Math.random()-0.5)*0.05, (Math.random()-0.5)*0.05, (Math.random()-0.5)*0.05)
            };
            moleculeGroup.add(mol);
            molecules.push(mol);
        }

        // 3. 온도 변화에 따른 위치 및 분자 운동 조절
        function updatePhysics() {
            if (!isPlaying) return;

            molecules.forEach((mol, idx) => {
                if (currentTemp > 4) {
                    // 고온: 무작위 빠른 열운동
                    const speed = (currentTemp - 4) * 0.005;
                    mol.position.x += (Math.random() - 0.5) * speed;
                    mol.position.y += (Math.random() - 0.5) * speed;
                    mol.position.z += (Math.random() - 0.5) * speed;
                } else if (currentTemp === 4) {
                    // 4°C: 가장 밀집된 형태로 수축 (가장 조밀)
                    const targetX = Math.cos(mol.userData.baseAngle) * 1.5;
                    const targetY = Math.sin(mol.userData.baseAngle) * 1.5;
                    mol.position.x += (targetX - mol.position.x) * 0.1;
                    mol.position.y += (targetY - mol.position.y) * 0.1;
                    mol.position.z *= 0.9;
                } else {
                    // 0°C 이하: 빈 공간을 품은 완전한 정육각형 격자로 고정/팽창
                    const targetX = Math.cos(mol.userData.baseAngle) * 3.0;
                    const targetY = Math.sin(mol.userData.baseAngle) * 3.0;
                    mol.position.x += (targetX - mol.position.x) * 0.1;
                    mol.position.y += (targetY - mol.position.y) * 0.1;
                    mol.position.z *= 0.9;
                }
            });
        }

        // 4. UI 이벤트 리스너
        const slider = document.getElementById('temp-slider');
        const tempValText = document.getElementById('temp-val');
        
        slider.addEventListener('input', (e) => {
            currentTemp = parseFloat(e.target.value);
            tempValText.innerText = `${currentTemp}°C`;
        });

        document.getElementById('btn-play').addEventListener('click', () => isPlaying = true);
        document.getElementById('btn-pause').addEventListener('click', () => isPlaying = false);

        // 5. 애니메이션 루프
        function animate() {
            requestAnimationFrame(animate);
            updatePhysics();
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // 창 크기 조절 대응
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
