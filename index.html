<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>단계별 물 ↔ 눈 결정 관찰 시뮬레이션</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050b14; font-family: sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; }
        #ui-panel {
            position: absolute; top: 20px; right: 20px;
            background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 20px; border-radius: 12px; color: white; width: 310px; backdrop-filter: blur(8px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .control-group { margin-bottom: 12px; }
        label { display: block; font-size: 13px; margin-bottom: 5px; color: #cbd5e1; }
        input[type=range], input[type=number] {
            width: 100%; box-sizing: border-box; background: #1e293b; border: 1px solid #475569;
            color: white; padding: 6px; border-radius: 6px; outline: none;
        }
        input[type=range] { cursor: pointer; }
        .btn-group { display: flex; gap: 8px; margin-top: 10px; }
        button {
            flex: 1; padding: 8px; border: none; border-radius: 6px;
            background: #2563eb; color: white; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        button:hover { background: #3b82f6; }
        .reset-btn { background: #ef4444; }
        .reset-btn:hover { background: #f87171; }
        .zoom-info { font-size: 15px; font-weight: bold; color: #38bdf8; text-align: right; }
        #info-text { font-size: 11px; color: #94a3b8; line-height: 1.4; margin-top: 12px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 8px; }
    </style>
    <!-- Three.js 및 OrbitControls 로드 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="ui-panel">
        <h3 style="margin-top:0; color:#38bdf8;">상변화 및 관찰 시뮬레이션</h3>
        
        <!-- 온도 조절 -->
        <div class="control-group">
            <label>온도 조절: <span id="temp-val" style="color:#38bdf8; font-weight:bold;">4°C</span></label>
            <input type="range" id="temp-slider" min="-20" max="40" value="4" step="1">
        </div>

        <!-- 분자 수 조절 -->
        <div class="control-group">
            <label>물 분자 수:</label>
            <input type="number" id="molecule-count" min="6" max="150" value="6" step="6">
        </div>

        <!-- 확대/축소 및 비율(%) 표시 -->
        <div class="control-group">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <label style="margin: 0;">확대/축소:</label>
                <span id="zoom-percent" class="zoom-info">100%</span>
            </div>
            <input type="range" id="zoom-slider" min="5" max="120" value="15" step="0.5">
        </div>

        <!-- 재생/멈춤/리셋 버튼 -->
        <div class="control-group btn-group">
            <button id="btn-play">▶ 재생 (강하)</button>
            <button id="btn-pause">⏸ 멈춤</button>
        </div>
        <button id="btn-reset" class="reset-btn" style="width:100%;">🔄 초기화</button>

        <div id="info-text">
            * <b>배율 단계별 관찰:</b><br>
            - 500%+ : 미시 H₂O 분자<br>
            - 200%~500% : 현미경 가시 결정 돋아남<br>
            - 80%~200% : 6각 대칭 눈 결정<br>
            - 80%- : 육안 관찰 (동근 눈송이)
        </div>
    </div>

    <script>
        // 1. Scene / Camera / Renderer 설정
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050b14, 0.01);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 15); // 기준 거리 15 = 100% 배율

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.minDistance = 3;
        controls.maxDistance = 120;

        // 조명
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        const pointLight = new THREE.PointLight(0x38bdf8, 2, 100);
        pointLight.position.set(10, 10, 15);
        scene.add(pointLight);

        // 2. 오브젝트 그룹
        let isPlaying = false;
        let isCooling = false;
        let currentTemp = 4;
        let molecules = [];
        let crystalBranches = [];

        const moleculeGroup = new THREE.Group();  // 1. 미시 분자
        const needleGroup = new THREE.Group();    // 2. 가시 돋아남 (현미경 영역)
        const crystalGroup = new THREE.Group();   // 3. 눈 결정 (거시 구조)
        const macroSnowGroup = new THREE.Group(); // 4. 동그란 눈송이 (육안 영역)

        scene.add(moleculeGroup);
        scene.add(needleGroup);
        scene.add(crystalGroup);
        scene.add(macroSnowGroup);

        // 3. 미시 H2O 분자 생성
        function createWaterMolecule() {
            const group = new THREE.Group();
            const oGeo = new THREE.SphereGeometry(0.3, 16, 16);
            const oMat = new THREE.MeshPhongMaterial({ color: 0xef4444, transparent: true, opacity: 1 });
            const oMesh = new THREE.Mesh(oGeo, oMat);
            group.add(oMesh);

            const hGeo = new THREE.SphereGeometry(0.15, 16, 16);
            const hMat = new THREE.MeshPhongMaterial({ color: 0xf8fafc, transparent: true, opacity: 1 });
            
            const h1 = new THREE.Mesh(hGeo, hMat);
            h1.position.set(0.35, 0.25, 0);
            const h2 = new THREE.Mesh(hGeo, hMat);
            h2.position.set(-0.35, 0.25, 0);
            
            group.add(h1);
            group.add(h2);
            return group;
        }

        // 4. 가시 돋아남 구조 (현미경 가시 결정)
        function createNeedleMesh() {
            needleGroup.clear();
            const mat = new THREE.MeshPhongMaterial({ color: 0x7dd3fc, transparent: true, opacity: 0 });
            for (let i = 0; i < 6; i++) {
                const angle = (i / 6) * Math.PI * 2;
                const needleGeo = new THREE.ConeGeometry(0.15, 2.5, 8);
                needleGeo.translate(0, 1.25, 0);
                const needle = new THREE.Mesh(needleGeo, mat.clone());
                needle.rotation.z = angle - Math.PI / 2;
                needleGroup.add(needle);
            }
        }
        createNeedleMesh();

        // 5. 정밀 눈 결정 구조 생성
        function createSnowflakeMesh() {
            crystalGroup.clear();
            crystalBranches = [];

            const material = new THREE.MeshPhongMaterial({ 
                color: 0x38bdf8, side: THREE.DoubleSide, transparent: true, opacity: 0, shininess: 90 
            });
            const snowflake = new THREE.Group();
            
            for (let i = 0; i < 6; i++) {
                const branch = new THREE.Group();
                const angle = (i / 6) * Math.PI * 2;

                const stemGeo = new THREE.BoxGeometry(0.15, 7, 0.08);
                stemGeo.translate(0, 3.5, 0);
                const stem = new THREE.Mesh(stemGeo, material.clone());
                branch.add(stem);
                crystalBranches.push({ mesh: stem, type: 'stem' });

                for (let j = 1; j <= 3; j++) {
                    const subGeo = new THREE.BoxGeometry(0.1, 2.0, 0.08);
                    subGeo.translate(0, 1.0, 0);

                    const sub1 = new THREE.Mesh(subGeo, material.clone());
                    sub1.position.set(0.15, j * 1.6, 0);
                    sub1.rotation.z = -Math.PI / 4;

                    const sub2 = new THREE.Mesh(subGeo, material.clone());
                    sub2.position.set(-0.15, j * 1.6, 0);
                    sub2.rotation.z = Math.PI / 4;

                    branch.add(sub1);
                    branch.add(sub2);
                    crystalBranches.push({ mesh: sub1, type: 'sub', delay: j * 0.2 });
                    crystalBranches.push({ mesh: sub2, type: 'sub', delay: j * 0.2 });
                }

                branch.rotation.z = angle;
                snowflake.add(branch);
            }
            crystalGroup.add(snowflake);
        }
        createSnowflakeMesh();

        // 6. 육안용 동그란 눈송이 입자 생성
        function createMacroSnowMesh() {
            macroSnowGroup.clear();
            const geo = new THREE.SphereGeometry(1.2, 32, 32);
            const mat = new THREE.MeshPhongMaterial({ color: 0xffffff, transparent: true, opacity: 0, shininess: 30 });
            const ball = new THREE.Mesh(geo, mat);
            macroSnowGroup.add(ball);
        }
        createMacroSnowMesh();

        // 7. 분자 초기화
        function initMolecules(count) {
            molecules.forEach(m => moleculeGroup.remove(m));
            molecules = [];

            for (let i = 0; i < count; i++) {
                const layer = Math.floor(i / 6);
                const indexInLayer = i % 6;
                const angle = (indexInLayer / 6) * Math.PI * 2;
                const radiusOffset = layer * 1.2;

                const mol = createWaterMolecule();
                mol.userData = { baseAngle: angle, radiusOffset: radiusOffset };
                moleculeGroup.add(mol);
                molecules.push(mol);
            }
        }
        initMolecules(6);

        // 8. 물리 연산 및 결정 성장 업데이트
        function updatePhysics() {
            if (isPlaying && isCooling) {
                if (currentTemp > -15) {
                    currentTemp -= 0.05;
                    document.getElementById('temp-slider').value = currentTemp;
                    document.getElementById('temp-val').innerText = `${Math.round(currentTemp)}°C`;
                }
            }

            // 미시 분자 연산
            molecules.forEach((mol) => {
                const layerRad = 1.2 + mol.userData.radiusOffset;

                if (currentTemp > 4) {
                    const speed = (currentTemp - 4) * 0.003;
                    mol.position.x += (Math.random() - 0.5) * speed;
                    mol.position.y += (Math.random() - 0.5) * speed;
                    mol.position.z += (Math.random() - 0.5) * speed;
                } else if (currentTemp === 4) {
                    const targetX = Math.cos(mol.userData.baseAngle) * layerRad;
                    const targetY = Math.sin(mol.userData.baseAngle) * layerRad;
                    mol.position.x += (targetX - mol.position.x) * 0.1;
                    mol.position.y += (targetY - mol.position.y) * 0.1;
                    mol.position.z *= 0.9;
                } else {
                    const targetX = Math.cos(mol.userData.baseAngle) * (layerRad * 1.8);
                    const targetY = Math.sin(mol.userData.baseAngle) * (layerRad * 1.8);
                    mol.position.x += (targetX - mol.position.x) * 0.1;
                    mol.position.y += (targetY - mol.position.y) * 0.1;
                    mol.position.z *= 0.9;
                }
            });

            // 성장 계수 (0°C 이하일 때 결정 자람)
            let growthFactor = 0;
            if (currentTemp <= 0) {
                growthFactor = Math.min(1, Math.max(0, (0 - currentTemp) / 15));
            }

            // 현미경 가시 돋아남 스케일
            needleGroup.children.forEach(needle => {
                needle.scale.set(growthFactor, growthFactor, growthFactor);
            });

            // 눈 결정 스케일
            crystalBranches.forEach((b) => {
                if (b.type === 'stem') {
                    b.mesh.scale.set(1, growthFactor, 1);
                } else if (b.type === 'sub') {
                    let subGrowth = Math.max(0, (growthFactor - b.delay) / (1 - b.delay));
                    b.mesh.scale.set(1, Math.min(1, subGrowth), 1);
                }
            });

            crystalGroup.rotation.z += 0.002;
            needleGroup.rotation.z += 0.002;
        }

        // 9. 시점(확대 비율 %) 및 온도별 4단계 시각화 페이드 로직
        function updateVisibilityAndZoomUI() {
            const dist = camera.position.distanceTo(scene.position);
            document.getElementById('zoom-slider').value = dist;

            // 확대 비율(%) 계산 (기준거리 15 = 100%)
            const zoomPercent = Math.round((15 / dist) * 100);
            document.getElementById('zoom-percent').innerText = `${zoomPercent}%`;

            // 0도 이하일 때만 영하의 결정 구조 보임
            let isFrozen = currentTemp <= 0;
            let frozenOpacity = isFrozen ? Math.min(1, Math.abs(currentTemp) / 5) : 0;

            // 가시성 알파값 정의 (배율 구간별)
            let molAlpha = 0;
            let needleAlpha = 0;
            let crystalAlpha = 0;
            let macroAlpha = 0;

            if (zoomPercent >= 500) {
                // 1단계: 미시 분자
                molAlpha = 1;
            } else if (zoomPercent >= 200) {
                // 2단계: 현미경 가시 돋아남
                let factor = (zoomPercent - 200) / 300;
                molAlpha = factor;
                needleAlpha = (1 - factor) * frozenOpacity;
            } else if (zoomPercent >= 80) {
                // 3단계: 정밀 눈 결정
                let factor = (zoomPercent - 80) / 120;
                needleAlpha = factor * frozenOpacity;
                crystalAlpha = (1 - factor) * frozenOpacity;
            } else {
                // 4단계: 육안 관찰 (동그란 눈송이)
                let factor = zoomPercent / 80;
                crystalAlpha = factor * frozenOpacity;
                macroAlpha = (1 - factor) * frozenOpacity;
            }

            // 알파 투명도 각각 적용
            molecules.forEach(mol => {
                mol.children.forEach(atom => atom.material.opacity = molAlpha);
            });

            needleGroup.children.forEach(n => n.material.opacity = needleAlpha);

            crystalGroup.traverse(child => {
                if (child.isMesh) child.material.opacity = crystalAlpha;
            });

            macroSnowGroup.children.forEach(b => b.material.opacity = macroAlpha);
        }

        // 10. UI 이벤트 연결
        const tempSlider = document.getElementById('temp-slider');
        const tempValText = document.getElementById('temp-val');
        const countInput = document.getElementById('molecule-count');
        const zoomSlider = document.getElementById('zoom-slider');

        tempSlider.addEventListener('input', (e) => {
            currentTemp = parseFloat(e.target.value);
            tempValText.innerText = `${Math.round(currentTemp)}°C`;
            isCooling = false;
        });

        countInput.addEventListener('change', (e) => {
            let val = parseInt(e.target.value);
            if (isNaN(val) || val < 1) val = 6;
            initMolecules(val);
        });

        zoomSlider.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            camera.position.setLength(val);
        });

        document.getElementById('btn-play').addEventListener('click', () => {
            isPlaying = true;
            isCooling = true;
            if (currentTemp > 4) currentTemp = 4;
        });

        document.getElementById('btn-pause').addEventListener('click', () => {
            isPlaying = false;
            isCooling = false;
        });

        document.getElementById('btn-reset').addEventListener('click', () => {
            isPlaying = false;
            isCooling = false;
            currentTemp = 4;
            tempSlider.value = 4;
            tempValText.innerText = '4°C';
            countInput.value = 6;
            initMolecules(6);
            camera.position.set(0, 0, 15);
            controls.target.set(0, 0, 0);
            controls.update();
        });

        controls.addEventListener('change', updateVisibilityAndZoomUI);

        // 11. 메인 애니메이션 루프
        function animate() {
            requestAnimationFrame(animate);
            updatePhysics();
            controls.update();
            updateVisibilityAndZoomUI();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
